bindd = SUPER, code:20, Toggle split, togglesplit,
bindd = SUPER, SPACE, Toggle floating, togglefloating,
bindd = SUPER, F, Force full screen, fullscreen, 0

# Window management with vi keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, l, Move focus right, movefocus, r

bindd = SUPER ALT, h, move window left, movewindow, l
bindd = SUPER ALT, j, move window down, movewindow, d
bindd = SUPER ALT, k, move window up, movewindow, u
bindd = SUPER ALT, l, move window right, movewindow, r

bindd = SUPER CTRL SHIFT, h, Expand window left, resizeactive, -200 0
bindd = SUPER CTRL SHIFT, j, Expand window down, resizeactive, 0 200
bindd = SUPER CTRL SHIFT, k, Shrink window up, resizeactive, 0 -200
bindd = SUPER CTRL SHIFT, l, Shrink window left, resizeactive, 200 0

# Switch workspaces with SUPER + easily acessible keys
bindd = SUPER, i, Switch to workspace 1, workspace, 1
bindd = SUPER, o, Switch to workspace 2, workspace, 2
bindd = SUPER, p, Switch to workspace 3, workspace, 3
bindd = SUPER, b, Switch to workspace 4, workspace, 4
bindd = SUPER, m, Switch to workspace 5, workspace, 5
bindd = SUPER, s, Switch to workspace 6, workspace, 6

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = SUPER ALT, i, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER ALT, o, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER ALT, p, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER ALT, b, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER ALT, m, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER ALT, s, Move window to workspace 6, movetoworkspace, 6

# Menus
bindd = SUPER, G, Launch apps, exec, rofi -show drun
bindd = SUPER, E, Emoji picker, exec, rofi -show emoji
bindd = SUPER SHIFT, G, Omarchy menu, exec, omarchy-menu

# Screenshots
bindd = , PRINT, Screenshot of region, exec, omarchy-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, omarchy-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, omarchy-cmd-screenshot output

