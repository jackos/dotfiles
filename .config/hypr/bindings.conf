######################################
# Keybindings
# ~/.local/share/omarchy/default/hypr/bindings/media.conf
# ~/.local/share/omarchy/default/hypr/bindings/tiling.conf
# ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
######################################

$terminal = uwsm app -- alacritty
$browser = omarchy-launch-browser
# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Apps
bindd = SUPER, return, Terminal, exec, $terminal --working-directory=$(omarchy-cmd-terminal-cwd)
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER, N, Neovim, exec, $terminal -e nvim
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, M, YouTube Music, exec, omarchy-launch-webapp "https://music.youtube.com/"
bindd = SUPER, C, Claude, exec, omarchy-launch-webapp "https://claude.ai/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT, S, Slack, exec, omarchy-launch-webapp "https://app.slack.com/client"

# Tiling
# code:20 is `-`, which is rightshift on my layout (see ../../supercaps.conf)
bindd = SUPER, W, Close active window, killactive,
bindd = SUPER, code:20, Toggle split, togglesplit,
bindd = SUPER, SPACE, Toggle floating, togglefloating,
bindd = SUPER, F, Force full screen, fullscreen, 0

# Window management with vi keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, l, Move focus right, movefocus, r

bindd = SUPER ALT, h, move window left, movewindow, l
bindd = SUPER ALT, j, move window down, movewindow, d
bindd = SUPER ALT, k, move window up, movewindow, u
bindd = SUPER ALT, l, move window right, movewindow, r

bindd = SUPER CTRL SHIFT, h, Expand window left, resizeactive, -200 0
bindd = SUPER CTRL SHIFT, j, Expand window down, resizeactive, 0 200
bindd = SUPER CTRL SHIFT, k, Shrink window up, resizeactive, 0 -200
bindd = SUPER CTRL SHIFT, l, Shrink window left, resizeactive, 200 0

# Switch workspaces with SUPER + easily acessible keys
bindd = SUPER, i, Switch to workspace 1, workspace, 1
bindd = SUPER, o, Switch to workspace 2, workspace, 2
bindd = SUPER, p, Switch to workspace 3, workspace, 3
bindd = SUPER, b, Switch to workspace 4, workspace, 4
bindd = SUPER, m, Switch to workspace 5, workspace, 5
bindd = SUPER, s, Switch to workspace 6, workspace, 6

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = SUPER ALT, i, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER ALT, o, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER ALT, p, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER ALT, b, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER ALT, m, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER ALT, s, Move window to workspace 6, movetoworkspace, 6

# Menus
bindd = SUPER, G, Launch apps, exec, rofi -show drun
bindd = SUPER, E, Emoji picker, exec, rofi -show emoji
bindd = SUPER SHIFT, G, Omarchy menu, exec, omarchy-menu
bindld = , XF86PowerOff, Power menu, exec, omarchy-menu system
bindd = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings

# Screenshots
bindd = , PRINT, Screenshot of region, exec, omarchy-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, omarchy-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, omarchy-cmd-screenshot output

# Screen recordings
bindd = ALT, PRINT, Screen record a region, exec, omarchy-cmd-screenrecord region
bindd = ALT SHIFT, PRINT, Screen record a region with audio, exec, omarchy-cmd-screenrecord region audio
bindd = CTRL ALT, PRINT, Screen record display, exec, omarchy-cmd-screenrecord output
bindd = CTRL ALT SHIFT, PRINT, Screen record display with audio, exec, omarchy-cmd-screenrecord output audio

# Color picker
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, omarchy-toggle-waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, omarchy-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, omarchy-menu theme

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, omarchy-toggle-idle

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight

# Control Apple Display brightness
bindd = CTRL, F1, Apple Display brightness down, exec, omarchy-cmd-apple-display-brightness -5000
bindd = CTRL, F2, Apple Display brightness up, exec, omarchy-cmd-apple-display-brightness +5000
bindd = SHIFT CTRL, F2, Apple Display full brightness, exec, omarchy-cmd-apple-display-brightness +60000


# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, $osdclient --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $osdclient --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $osdclient --brightness lower

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $osdclient --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $osdclient --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, $osdclient --brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, $osdclient --brightness -1

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, $osdclient --playerctl next
bindld = , XF86AudioPause, Pause, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, $osdclient --playerctl previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, omarchy-cmd-audio-switch

