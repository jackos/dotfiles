# Application bindings
$terminal = uwsm app -- alacritty
$browser = omarchy-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --working-directory=$(omarchy-cmd-terminal-cwd)
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER, N, Neovim, exec, $terminal -e nvim
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER, C, Claude, exec, omarchy-launch-webapp "https://claude.ai/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"

# Media keys
bindeld = ,F1, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = ,F2, Brightness down, exec, $osdclient --brightness lower
bindeld = ,F3, Brightness up, exec, $osdclient --brightness raise

bindld = SUPER, F1, Switch audio output, exec, omarchy-cmd-audio-switch
bindeld = SUPER, F2, Brightness down precise, exec, $osdclient --brightness -1
bindeld = SUPER, F3, Brightness up precise, exec, $osdclient --brightness +1

# Control tiling
unbind = SUPER, J
unbind = SUPER, P
unbind = SUPER, V
unbind = SUPER, F11

bindd = SUPER, S, Toggle split, togglesplit, # dwindle
bindd = SUPER, SPACE, Toggle floating, togglefloating,
bindd = SUPER, F, Force full screen, fullscreen, 0

# Window management with vi keys
unbind = SUPER, left
unbind = SUPER, right
unbind = SUPER, up
unbind = SUPER, down
unbind = SUPER SHIFT, left
unbind = SUPER SHIFT, right
unbind = SUPER SHIFT, up
unbind = SUPER SHIFT, down

bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, l, Move focus right, movefocus, r

bindd = SUPER SHIFT, h, move window left, movewindow, l
bindd = SUPER SHIFT, j, move window down, movewindow, d
bindd = SUPER SHIFT, k, move window up, movewindow, u
bindd = SUPER SHIFT, l, move window right, movewindow, r

bindd = SUPER CTRL SHIFT, h, Expand window left, resizeactive, -200 0
bindd = SUPER CTRL SHIFT, l, Shrink window left, resizeactive, 200 0
bindd = SUPER CTRL SHIFT, k, Shrink window up, resizeactive, 0 -200
bindd = SUPER CTRL SHIFT, j, Expand window down, resizeactive, 0 200

# Switch workspaces with SUPER + [0-9]
bindd = SUPER, i, Switch to workspace 1, workspace, 1
bindd = SUPER, o, Switch to workspace 2, workspace, 2
bindd = SUPER, p, Switch to workspace 3, workspace, 3
bindd = SUPER, b, Switch to workspace 4, workspace, 4
bindd = SUPER, m, Switch to workspace 5, workspace, 5

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = SUPER SHIFT, i, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, o, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, p, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, b, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, m, Move window to workspace 5, movetoworkspace, 5

# Menus
unbind = SUPER, SPACE
unbind = SUPER CTRL, E
unbind = SUPER ALT, SPACE
unbind = SUPER, K

bindd = SUPER, G, Launch apps, exec, walker -p "Start…"
bindd = SUPER, E, Emoji picker, exec, walker -m Emojis
bindd = SUPER SHIFT, G, Omarchy menu, exec, omarchy-menu

