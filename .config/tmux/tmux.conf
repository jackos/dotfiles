set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",foot:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g extended-keys on
set -as terminal-features 'foot:extkeys'

# Detect vim/neovim in current pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

# Reload config
bind-key -n M-R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Ctrl+Alt+hjkl = new tmux splits (always, even inside vim)
bind-key -n C-M-h split-window -hb -c "#{pane_current_path}"
bind-key -n C-M-j split-window -v -c "#{pane_current_path}"
bind-key -n C-M-k split-window -vb -c "#{pane_current_path}"
bind-key -n C-M-l split-window -h -c "#{pane_current_path}"

# Ctrl+j = new tmux window, Ctrl+h/l = navigate windows (forwards to vim when in vim)
bind-key -n C-j new-window -c "#{pane_current_path}"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'previous-window'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'next-window'

# Alt+t = next window if multiple exist, otherwise create one
bind-key -n M-t if-shell '[ #{session_windows} -gt 1 ]' 'next-window' 'new-window -c "#{pane_current_path}"'

# Alt+w = close pane (forwards to vm when in vim)
bind-key -n M-w if-shell "$is_vim" 'send-keys M-w' 'if-shell "[ #{window_panes} -gt 1 ]" kill-pane'

# Ctrl+w = close window (forwards to vim when in vim)
bind-key -n C-w if-shell "$is_vim" 'send-keys C-w' 'if-shell "[ $(tmux list-sessions | wc -l) -gt 1 ]" kill-window'

# Shift+Alt+hjkl = create splits (forwards to vim when in vim)
bind-key -n M-H if-shell "$is_vim" 'send-keys M-H' 'split-window -hb -c "#{pane_current_path}"'
bind-key -n M-J if-shell "$is_vim" 'send-keys M-J' 'split-window -v -c "#{pane_current_path}"'
bind-key -n M-K if-shell "$is_vim" 'send-keys M-K' 'split-window -vb -c "#{pane_current_path}"'
bind-key -n M-L if-shell "$is_vim" 'send-keys M-L' 'split-window -h -c "#{pane_current_path}"'

# Ctrl+f = toggle fullscreen (zoom) current pane
bind-key -n C-f resize-pane -Z

# Alt+Shift+R = enter resize mode (hjkl to resize, Escape/Enter/q to exit)
bind-key -n M-r switch-client -T resize
bind-key -T resize h resize-pane -L 4 \; switch-client -T resize
bind-key -T resize j resize-pane -D 4 \; switch-client -T resize
bind-key -T resize k resize-pane -U 4 \; switch-client -T resize
bind-key -T resize l resize-pane -R 4 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize Enter switch-client -T root
bind-key -T resize q switch-client -T root
bind-key -T resize M-r switch-client -T root

# vim-tmux navigation with Alt+hjkl
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# Vi copy mode: Ctrl+Space to enter and toggle column mode, esc to exit
setw -g mode-keys vi
bind-key -n C-Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-Space send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
# Tokyonight Night status bar
set -g status-style "bg=#16161e,fg=#c0caf5"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#737aa2]%H:%M "
set -g status-left-length 30
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-format "#[fg=#545c7e] #I:#W "
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=#283457"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
