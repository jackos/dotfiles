[colors]
[colors.primary]
background = '#1a1b26'
foreground = '#a9b1d6'

# Normal colors
[colors.normal]
black = '#32344a'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#ad8ee6'
cyan = '#449dab'
white = '#787c99'

# Bright colors
[colors.bright]
black = '#444b6a'
red = '#ff7a93'
green = '#b9f27c'
yellow = '#ff9e64'
blue = '#7da6ff'
magenta = '#bb9af7'
cyan = '#0db9d7'
white = '#acb0d0'

[colors.selection]
background = '#7aa2f7'


[env]
TERM = "xterm-256color"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 10

[mouse]
hide_when_typing = true

[window]
padding.x = 14
padding.y = 14
opacity = 0.98
decorations = "None"
option_as_alt = "OnlyLeft"

[scrolling]
history = 100000

[keyboard]
bindings = [
  { action = "ScrollPageUp", key = "PageUp" },
  { action = "ScrollPageDown", key = "PageDown" },
  { action = "First", key = "Home", mode = "Vi" },
  { action = "Last", key = "End", mode = "Vi" },
]

[terminal.shell]
program = "/usr/bin/fish"
args = ["-l"]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = false
post_processing = false
persist = false
mouse.enabled = true
binding = { mods = "Control|Shift|Alt", key = "O" }
# Regex to minimize false positives on filepaths
# /*               Optionally start with forward slash
# [a-zA-Z]+        Must start with a letter (remomves e.g. 4.0k)
# [\\w_/-]*        Any combination of valid file path chars
# \\.[\\w_/-]+     Contains a `.` and is followed by at least one valid char
# :*[0-9]*:*[0-9]* Include file/line number if they exist
regex = "/*[a-zA-Z]+[\\w_/-]*\\.[\\.\\w_/-]+:*[0-9]*:*[0-9]*"

