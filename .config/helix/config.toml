C-d = ["half_page_down", "goto_window_bottom"]
C-u = ["half_page_up", "goto_window_top"]
A-i = "hover"
A-h = "jump_view_left"
A-l = "jump_view_right"
A-j = "jump_view_down"
A-k = "jump_view_up"
A-n = "vsplit"
A-b = "hsplit"
C-c = ":q"
A-w = ":q"
A-c = "toggle_comments"
C-s = ":w"
A-f = "flip_selections"
V = ["extend_line"]
y = "yank_joined_to_clipboard"
d = ["delete_selection"]
x = ["yank_joined_to_clipboard", "delete_selection"]
A-d = "delete_selection_noyank"
c = "change_selection_noyank"
p = "paste_clipboard_after"
P = "paste_clipboard_before"
';' = "repeat_last_motion"
"esc" = ["collapse_selection", "normal_mode"]
"A-r" = [":config-reload", ":reload"]
