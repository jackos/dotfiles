"home" = ["goto_line_start"]
"end" = ["goto_line_end"]
"S-home" = ["goto_line_start"]
"S-end" = ["goto_line_end"]
space = { "space" = [
    "extend_line",
    "select_mode",
], f = "file_picker_in_current_directory", F = "file_picker", c = "toggle_comments" }

[keys.insert]
